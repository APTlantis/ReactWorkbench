[component]
id = "shadcn-fixture-button"
name = "Button (shadcn Fixture Registry)"
description = 'Action button fixture shaped like a shadcn registry item. Imported from examples/shadcn-registry using the shadcn adapter. Source files: components/ui/button.tsx. Local files: imports\shadcn\shadcn-fixture\components/ui/button.tsx.'
themes = [
    "light",
    "dark",
    "aurora",
]

[framework]
react = true
svelte = false

[[props]]
id = "label"
label = "Label"
kind = "text"
default = "Button"
values = []

[[props]]
id = "source"
label = "Source"
kind = "text"
default = "shadcn Fixture Registry"
values = []

[[props]]
id = "adapter"
label = "Adapter"
kind = "text"
default = "shadcn"
values = []

[[props]]
id = "itemType"
label = "Item Type"
kind = "text"
default = "registry:ui"
values = []

[[props]]
id = "files"
label = "Files"
kind = "text"
default = "components/ui/button.tsx"
values = []

[[props]]
id = "dependencies"
label = "Dependencies"
kind = "text"
default = "@radix-ui/react-slot, class-variance-authority"
values = []

[[props]]
id = "materializedFiles"
label = "Materialized Files"
kind = "text"
default = 'imports\shadcn\shadcn-fixture\components/ui/button.tsx'
values = []

[[props]]
id = "previewStatus"
label = "Preview Status"
kind = "text"
default = "metadata-import"
values = []

[[states]]
id = "imported"
label = "Imported"

[states.props]
adapter = "shadcn"
dependencies = "@radix-ui/react-slot, class-variance-authority"
files = "components/ui/button.tsx"
itemType = "registry:ui"
label = "Button"
materializedFiles = 'imports\shadcn\shadcn-fixture\components/ui/button.tsx'
previewStatus = "metadata-import"
source = "shadcn Fixture Registry"
