[component]
id = "shadcn-fixture-card"
name = "Card (shadcn Fixture Registry)"
description = 'Surface fixture for adapter catalog and preview planning. Imported from examples/shadcn-registry using the shadcn adapter. Source files: components/ui/card.tsx. Local files: imports\shadcn\shadcn-fixture\components/ui/card.tsx.'
themes = [
    "light",
    "dark",
    "aurora",
]

[framework]
react = true
svelte = false

[[props]]
id = "label"
label = "Label"
kind = "text"
default = "Card"
values = []

[[props]]
id = "source"
label = "Source"
kind = "text"
default = "shadcn Fixture Registry"
values = []

[[props]]
id = "adapter"
label = "Adapter"
kind = "text"
default = "shadcn"
values = []

[[props]]
id = "itemType"
label = "Item Type"
kind = "text"
default = "registry:ui"
values = []

[[props]]
id = "files"
label = "Files"
kind = "text"
default = "components/ui/card.tsx"
values = []

[[props]]
id = "dependencies"
label = "Dependencies"
kind = "text"
default = "none"
values = []

[[props]]
id = "materializedFiles"
label = "Materialized Files"
kind = "text"
default = 'imports\shadcn\shadcn-fixture\components/ui/card.tsx'
values = []

[[props]]
id = "previewStatus"
label = "Preview Status"
kind = "text"
default = "metadata-import"
values = []

[[states]]
id = "imported"
label = "Imported"

[states.props]
adapter = "shadcn"
dependencies = "none"
files = "components/ui/card.tsx"
itemType = "registry:ui"
label = "Card"
materializedFiles = 'imports\shadcn\shadcn-fixture\components/ui/card.tsx'
previewStatus = "metadata-import"
source = "shadcn Fixture Registry"
