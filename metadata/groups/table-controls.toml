[group]
id = "table-controls"
name = "Table Controls"
description = "A dense table header with filtering, row state, and batch action controls."
layout = "table-header"
themes = ["light", "dark", "aurora"]

[[items]]
component = "input"
state = "warning-empty"
role = "Filter"

[[items]]
component = "table-control"
state = "batch-selected"
role = "Rows"

[[items]]
component = "button"
state = "secondary-disabled"
role = "Batch"
